<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capsa Banting</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; height: 100dvh; overflow: visible; }

/* Lobby overlay */
#lobby-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; }
#lobby-overlay .panel { background: #16213e; border-radius: 12px; padding: 32px; text-align: center; min-width: 340px; }
#lobby-overlay h2 { margin-bottom: 20px; color: #e94560; }
#lobby-overlay .lobby-section { margin: 16px 0; }
#lobby-overlay label { display: block; text-align: left; color: #aaa; font-size: 13px; margin-bottom: 4px; }
#lobby-overlay input { padding: 8px 12px; border: 1px solid #444; border-radius: 6px; background: #0f3460; color: #fff; font-size: 14px; width: 100%; margin-bottom: 8px; }
#lobby-overlay input:focus { outline: none; border-color: #e94560; }
#lobby-overlay button { padding: 10px 24px; background: #e94560; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; margin: 4px; }
#lobby-overlay button:hover { background: #c73650; }
#lobby-overlay .divider { color: #555; margin: 12px 0; font-size: 13px; }
#room-code-display { font-size: 28px; font-weight: 700; color: #ffd700; letter-spacing: 4px; margin: 12px 0; font-family: monospace; }
#lobby-player-list { text-align: left; margin: 12px 0; min-height: 40px; }
#lobby-player-list .lobby-player { padding: 4px 0; font-size: 14px; color: #ccc; }
#lobby-error { color: #ff5252; font-size: 12px; margin-top: 8px; min-height: 16px; }

/* Connection status */
#connection-status { font-size: 10px; padding: 2px 10px; border-radius: 8px; position: absolute; left: 50%; transform: translateX(-50%); }
#connection-status.connected { background: #2e7d32; color: #fff; }
#connection-status.disconnected { background: #c62828; color: #fff; }

/* Main layout */
#app { display: grid; grid-template-columns: 1fr 260px; grid-template-rows: 50px 1fr; height: 100vh; height: 100dvh; }
#header { grid-column: 1 / -1; background: #16213e; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 2px solid #0f3460; position: relative; }
#header h1 { color: #e94560; font-size: 20px; }
#header .controls { display: flex; gap: 8px; align-items: center; }
#header button { padding: 6px 16px; background: #e94560; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
#header button:hover { background: #c73650; }
#sidebar-toggle-btn { padding: 6px 10px; background: #0f3460; font-size: 15px; }
#sidebar-toggle-btn:hover { background: #1a4a7a; }

/* Table area */
#table-area { display: grid; grid-template-rows: 1fr 1fr 1fr; grid-template-columns: 1fr 1fr 1fr; position: relative; background: radial-gradient(ellipse at center, #1a5c2a 0%, #0d3518 100%); overflow: hidden; }

/* Player areas */
.player-area { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; position: relative; }
.player-area.pos-bottom { justify-content: flex-start; }
 .player-area.pos-top { grid-row: 1; grid-column: 2; }
  .player-area.pos-right { grid-row: 2; grid-column: 3; }
  .player-area.pos-bottom { grid-row: 3; grid-column: 2; padding-bottom: 48px; }
  .player-area.pos-left { grid-row: 2; grid-column: 1; }

.player-label { font-size: 13px; font-weight: 600; margin: 4px 0; display: flex; align-items: center; gap: 8px; }
.player-label .card-count { font-size: 11px; color: #aaa; font-weight: 400; }
.player-label .turn-badge { background: #e94560; color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 10px; }
.player-label .bot-badge { background: #4a4a6a; color: #ccc; font-size: 10px; padding: 2px 8px; border-radius: 10px; }
.player-label .finished-badge { background: #2e7d32; color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 10px; }

.active-player .player-label { color: #ffd700; }
.active-player { background: rgba(255,215,0,0.08); border-radius: 8px; }

/* Hands */
.hand { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; }
.hand-bottom { flex-wrap: nowrap; overflow-x: hidden; overflow-y: visible; padding: 10px 8px 4px; }
.hand-bottom .card:first-child { margin-left: 0; }
.hand-top { display: flex; flex-wrap: nowrap; }
.hand-top .card {
    width: 28px;
    height: 40px;
    margin-left: -6px;
    flex-shrink: 0;
}
.hand-top .card:first-child { margin-left: 0; }
.hand-top .card .rank, .hand-top .card .suit { display: none; }
.hand-top .card.face-down::after { transform: rotate(180deg); }
.hand-left, .hand-right { flex-direction: column; gap: 0; justify-content: center; }
.hand-left .card, .hand-right .card { transform: rotate(90deg); margin: -6px 0; width: 28px; height: 40px; flex-shrink: 0; }
.hand-left .card.selected, .hand-right .card.selected { transform: rotate(90deg) translateY(-6px); }
.hand-left .card .rank, .hand-left .card .suit,
.hand-right .card .rank, .hand-right .card .suit { display: none; }
.hand-right .card.face-down::after { transform: rotate(180deg); }

/* Cards */
.card { width: 40px; height: 56px; border-radius: 5px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; cursor: pointer; border: 2px solid #ccc; user-select: none; transition: transform 0.15s, box-shadow 0.15s; position: relative; -webkit-tap-highlight-color: transparent; touch-action: manipulation; margin-left: -10px; }
.card.red { color: #e74c3c; }
.card.black { color: #2c3e50; }
.card.red { color: #d32f2f; }
.card.black { color: #222; }
.card .rank { font-size: 13px; line-height: 1; }
.card .suit { font-size: 16px; line-height: 1; }
.card.selected { border-color: #ffd700; transform: translateY(-6px); box-shadow: 0 4px 12px rgba(255,215,0,0.5); z-index: 10; }
.card.card-hovered:not(.selected):not(.face-down) { transform: scale(1.08); transform-origin: bottom center; box-shadow: 0 6px 16px rgba(255,255,255,0.2); border-color: #fff; z-index: 5; }
.card.drag-placeholder { opacity: 0.25; transform: scale(0.85); transition: opacity 0.15s, transform 0.15s; }
.card.drag-target { border-color: #ffd700; box-shadow: 0 0 0 3px rgba(255,215,0,0.5); transform: scale(1.05); transition: transform 0.15s, box-shadow 0.15s; }
.card.drag-follower { position: fixed; z-index: 9999; pointer-events: none; transform: translate(-50%, -50%) rotate(-3deg) scale(1.1); box-shadow: 0 12px 32px rgba(0,0,0,0.5); transition: none; }
.card.tapped { animation: cardTap 0.2s ease; }
@keyframes cardTap {
  0% { transform: scale(1); }
  50% { transform: scale(0.92); }
  100% { transform: scale(1); }
}
#action-bar button:active { transform: scale(0.95); }

/* Face-down card */
.card.face-down { background: linear-gradient(135deg, #1a3a5c, #2a5a8c); border-color: #3a6a9c; cursor: default; }
.card.face-down .rank, .card.face-down .suit { display: none; }
.card.face-down::after { content: '\2660'; color: rgba(255,255,255,0.15); font-size: 24px; }

/* Center play area */
#center-area { grid-row: 2; grid-column: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
#center-cards { display: flex; gap: 3px; min-height: 56px; min-width: 120px; align-items: center; justify-content: center; }
#center-info { font-size: 12px; color: #ffd700; text-align: center; min-height: 18px; }
#pass-markers { display: flex; gap: 6px; min-height: 18px; }
.pass-tag { font-size: 11px; color: #ff8a80; background: rgba(255,0,0,0.1); padding: 1px 8px; border-radius: 8px; }

/* Action bar */
#action-bar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: none; gap: 10px; align-items: center; z-index: 100; background: rgba(0,0,0,0.6); padding: 6px 16px; border-radius: 10px; max-width: calc(100% - 16px); }
#action-bar.visible { display: flex; }
#action-bar button { padding: 8px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
#btn-sort { background: #2196f3; color: #fff; }
#btn-sort:disabled { background: #555; color: #888; cursor: not-allowed; }
#btn-play { background: #4caf50; color: #fff; }
#btn-play:disabled { background: #555; color: #888; cursor: not-allowed; }
#btn-pass { background: #ff9800; color: #fff; }
#btn-pass:disabled { background: #555; color: #888; cursor: not-allowed; }
#error-msg { color: #ff5252; font-size: 12px; text-align: center; white-space: nowrap; }
#turn-indicator { color: #ffd700; font-size: 13px; font-weight: 600; margin-right: 12px; white-space: nowrap; }
#combo-preview { color: #aaa; font-size: 12px; white-space: nowrap; }
#combo-preview:empty, #error-msg:empty { display: none; }

/* Sidebar */
#app.no-sidebar { grid-template-columns: 1fr 0px; }
#sidebar { background: #16213e; border-left: 2px solid #0f3460; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
#sidebar h3 { padding: 10px 12px; font-size: 14px; color: #e94560; border-bottom: 1px solid #0f3460; }
#scoreboard { padding: 8px 12px; border-bottom: 1px solid #0f3460; }
#scoreboard .score-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
#scoreboard .score-row .name { color: #ccc; }
#scoreboard .score-row .pts { color: #ffd700; font-weight: 600; }
#log { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 12px; }
#log .log-entry { padding: 3px 0; border-bottom: 1px solid #0f346022; color: #bbb; }
#log .log-entry strong { color: #e94560; }
#log .log-entry .bot { color: #64b5f6; }

/* Game over overlay */
#gameover-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 90; }
#gameover-overlay.show { display: flex; }
#gameover-overlay .panel { background: #16213e; border-radius: 12px; padding: 32px 48px; text-align: center; }
#gameover-overlay h2 { color: #ffd700; margin-bottom: 16px; }
#gameover-overlay .final-scores { margin: 16px 0; text-align: left; }
#gameover-overlay .final-scores div { padding: 4px 0; font-size: 14px; }
#gameover-overlay button { margin-top: 16px; padding: 10px 32px; background: #e94560; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
#gameover-overlay button:hover { background: #c73650; }

/* 3-discard phase overlay */
#three-phase-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 80; }
#three-phase-overlay.show { display: flex; }
#three-phase-overlay .panel { background: #16213e; border-radius: 12px; padding: 24px 40px; text-align: center; }
#three-phase-overlay h2 { color: #ffd700; margin-bottom: 8px; font-size: 22px; }
#three-phase-overlay .subtitle { color: #aaa; font-size: 13px; margin-bottom: 20px; }

/* 3-discard player areas */
.three-discard-grid { display: flex; gap: 24px; align-items: flex-start; justify-content: center; flex-wrap: wrap; max-width: 700px; }
.three-discard-player { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 120px; }
.three-discard-player .tdp-name { font-size: 14px; font-weight: 600; color: #ccc; }
.three-discard-player .tdp-name.active { color: #ffd700; }
.three-discard-player .tdp-name.discarded { color: #666; text-decoration: line-through; }
.three-discard-player .tdp-cards { display: flex; gap: 4px; min-height: 64px; align-items: center; justify-content: center; }
.three-discard-player .tdp-cards .card { transition: all 0.4s ease; }
.three-discard-player .tdp-cards .card.discarding { opacity: 0.3; transform: scale(0.8); }
.three-discard-player .tdp-count { font-size: 11px; color: #888; }
#three-phase-center-info { margin-top: 20px; font-size: 16px; color: #ffd700; min-height: 24px; font-weight: 600; }

/* --- Responsive: Tablet portrait (769-1024px) --- */
@media (min-width: 769px) and (max-width: 1024px) and (orientation: portrait) {
  #app { grid-template-columns: 1fr 200px; }
  .card { width: 36px; height: 50px; font-size: 11px; margin-left: -8px; }
  .card .rank { font-size: 11px; }
  .card .suit { font-size: 14px; }
  .card.face-down::after { font-size: 20px; }
  #sidebar h3 { font-size: 13px; padding: 8px 10px; }
  #scoreboard .score-row { font-size: 12px; }
  #log { font-size: 11px; }
  .player-label { font-size: 12px; }
  #header h1 { font-size: 18px; }
  .hand-bottom { overflow-x: auto; -webkit-overflow-scrolling: touch; }
}

/* --- Responsive: Tablet landscape (max 1024px, wide screens) --- */
@media (max-width: 1024px) and (orientation: landscape) and (min-height: 400px) {
  #app { grid-template-columns: 1fr 200px; }
  .card { width: 36px; height: 50px; font-size: 11px; margin-left: -8px; }
  .card .rank { font-size: 11px; }
  .card .suit { font-size: 14px; }
  .card.face-down::after { font-size: 20px; }
  #sidebar h3 { font-size: 13px; padding: 8px 10px; }
  #scoreboard .score-row { font-size: 12px; }
  #log { font-size: 11px; }
  .player-label { font-size: 12px; }
  #header h1 { font-size: 18px; }
}

/* --- Responsive: Mobile portrait (shorter dim ≤ 768px, portrait) --- */
@media (max-width: 768px) and (orientation: portrait) {
  #app, #app.no-sidebar {
    grid-template-columns: 1fr;
    grid-template-rows: 38px 1fr auto;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow: visible;
  }
  #header { padding: 0 8px; }
  #header h1 { font-size: 14px; }
  #header button { padding: 3px 10px; font-size: 11px; }
  #sidebar-toggle-btn { display: none; }

  #sidebar {
    grid-column: 1 / -1;
    grid-row: 3;
    border-left: none;
    border-top: 2px solid #0f3460;
    max-height: 44px;
    flex-direction: row;
  }
  #sidebar h3 { display: none; }
  #scoreboard {
    display: flex;
    gap: 2px;
    border-bottom: none;
    border-right: none;
    padding: 2px 6px;
    flex: 1;
    justify-content: space-between;
  }
  #scoreboard .score-row {
    display: flex;
    flex-direction: column;
    font-size: 9px;
    padding: 0 2px;
    align-items: center;
    flex: 1;
    min-width: 0;
  }
  #scoreboard .score-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  #log { display: none; }

  /* Diamond layout: all 4 players visible, wider side columns */
  #table-area {
    grid-row: 2;
    grid-column: 1;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 48px 1fr 48px;
    overflow: visible;
  }

  /* Player areas: constrained within grid cells */
  .player-area { width: 100%; }
  .player-area.pos-top, .player-area.pos-left, .player-area.pos-right { overflow: hidden; }
  .player-area.pos-bottom { overflow: visible; }
  .player-area.pos-top {
    grid-row: 1; grid-column: 2;
    padding: 2px 4px;
  }
  .player-area.pos-bottom {
    grid-row: 3; grid-column: 1 / -1;
    padding: 4px 4px calc(46px + env(safe-area-inset-bottom, 0px));
    overflow: visible;
  }
  .player-area.pos-left {
    grid-row: 2; grid-column: 1;
    padding: 2px 2px;
    align-items: center;
    justify-content: center;
  }
  .player-area.pos-right {
    grid-row: 2; grid-column: 3;
    padding: 2px 2px;
    align-items: center;
    justify-content: center;
  }

  #center-area { grid-row: 2; grid-column: 2; gap: 2px; }
  #center-cards { min-height: 44px; min-width: 80px; gap: 2px; }
  #center-info { font-size: 10px; min-height: 14px; }
  #pass-markers { gap: 4px; min-height: 14px; }

  /* Player labels: wrap within area */
  .player-label { font-size: 10px; gap: 2px; flex-wrap: wrap; justify-content: center; width: 100%; margin: 2px 0; }
  .player-label .card-count { font-size: 9px; }

  /* Opponent hands: compact card-back strips, JS-scaled to fit */
  .hand-top {
    flex-wrap: nowrap;
    gap: 1px;
    overflow-x: auto;
    overflow-y: hidden;
    max-width: 100%;
    scrollbar-width: none;
    justify-content: center;
    width: 100%;
    padding: 1px 0;
  }
  .hand-top::-webkit-scrollbar { display: none; }
  .hand-top .card { width: 20px; height: 28px; flex-shrink: 0; margin-left: -5px; }
  .hand-top .card:first-child { margin-left: 0; }
  .hand-top .card .rank, .hand-top .card .suit { display: none; }
  .hand-top .card.face-down::after { font-size: 14px; transform: rotate(180deg); }

  .hand-left, .hand-right {
    flex-direction: column;
    gap: 0;
    overflow-y: auto;
    overflow-x: hidden;
    max-height: calc(100dvh - 180px);
    min-height: 40px;
    scrollbar-width: none;
    width: 100%;
    align-items: center;
    justify-content: center;
    padding: 1px 0;
  }
  .hand-left::-webkit-scrollbar, .hand-right::-webkit-scrollbar { display: none; }
  .hand-left .card, .hand-right .card {
    transform: rotate(90deg);
    width: 20px;
    height: 28px;
    margin: -5px 0;
    flex-shrink: 0;
  }
  .hand-left .card:first-child, .hand-right .card:first-child { margin-top: 0; }
  .hand-left .card .rank, .hand-left .card .suit,
  .hand-right .card .rank, .hand-right .card .suit { display: none; }
  .hand-left .card.face-down::after,
  .hand-right .card.face-down::after { font-size: 14px; }
  .hand-right .card.face-down::after { transform: rotate(180deg); }

  /* Human hand: JS-scaled to always fit, no scroll */
  .hand-bottom {
    flex-wrap: nowrap;
    gap: 1px;
    overflow: visible;
    padding: 4px 2px 8px;
    scrollbar-width: none;
    max-width: 100%;
    width: 100%;
    box-sizing: border-box;
    justify-content: center;
  }
  .hand-bottom::-webkit-scrollbar { display: none; }

  .card.selected {
    transform: translateY(-10px);
    border-color: #ffd700;
    box-shadow: 0 4px 12px rgba(255,215,0,0.5);
    z-index: 10;
  }

  /* Cards: JS-scaled to fit, no scroll */
  .card {
    margin-left: 0;
    flex-shrink: 0;
  }
  .card .rank { font-size: 11px; }
  .card .suit { font-size: 14px; }
  .card.face-down::after { font-size: 16px; }

  /* Action bar: centered pill above sidebar */
  #action-bar {
    bottom: calc(46px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    padding: 4px 6px;
    gap: 3px;
    flex-wrap: wrap;
    justify-content: stretch;
    width: calc(100% - 8px);
    max-width: calc(100vw - 8px);
    z-index: 20;
  }
  #action-bar #combo-preview, #action-bar #error-msg {
    width: 100%;
    text-align: center;
    order: -1;
  }
  #action-bar button {
    padding: 6px 10px;
    font-size: 13px;
    min-height: 36px;
    flex: 1 1 auto;
  }
  #turn-indicator { font-size: 11px; margin-right: 4px; flex-shrink: 0; }
  #combo-preview { font-size: 10px; }
  #error-msg { font-size: 10px; }

  /* Overlays */
  #lobby-overlay .panel { padding: 20px; margin: 0 12px; min-width: auto; }
  #gameover-overlay .panel { padding: 24px; margin: 0 12px; }
  #three-phase-overlay .panel { padding: 16px; margin: 0 12px; }
  .three-discard-grid { gap: 12px; max-width: 95vw; flex-direction: column; align-items: center; }
  .three-discard-player { min-width: 80px; }
  .three-discard-player .tdp-cards .card { width: 36px; height: 50px; }
  .three-discard-player .tdp-cards .card .rank { font-size: 11px; }
  .three-discard-player .tdp-cards .card .suit { font-size: 14px; }
}

/* --- Responsive: Mobile landscape (shorter dim ≤ 768px, landscape) --- */
@media (max-height: 768px) and (orientation: landscape) and (min-width: 480px) {
  #app, #app.no-sidebar {
    grid-template-columns: 1fr;
    grid-template-rows: 36px 1fr;
  }
  #header { padding: 0 8px; }
  #header h1 { font-size: 14px; }
  #header button { padding: 3px 8px; font-size: 11px; }
  #sidebar-toggle-btn { display: none; }

  #sidebar {
    position: fixed; bottom: 0; left: 0; right: 0;
    border-left: none; border-top: 2px solid #0f3460;
    max-height: 80px;
    flex-direction: row;
    z-index: 50;
  }
  #sidebar h3 { display: none; }
  #scoreboard {
    display: flex; gap: 10px;
    border-bottom: none; border-right: none;
    padding: 4px 10px;
    flex: 1; justify-content: space-around;
  }
  #scoreboard .score-row {
    flex-direction: column; font-size: 10px; padding: 1px 0;
    align-items: center;
  }
  #log { display: none; }

  #table-area {
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 32px 1fr 32px;
    overflow: visible;
  }
  .player-area.pos-top {
    grid-row: 1; grid-column: 2;
    padding: 2px 8px;
  }
  .player-area.pos-bottom {
    grid-row: 3; grid-column: 1 / -1;
    padding-bottom: calc(84px + 16px + env(safe-area-inset-bottom, 0px));
  }
  .player-area.pos-left {
    grid-row: 2; grid-column: 1;
    padding: 2px;
    align-items: center;
  }
  .player-area.pos-right {
    grid-row: 2; grid-column: 3;
    padding: 2px;
    align-items: center;
  }
  #center-area { grid-row: 2; grid-column: 2; }

  .hand-top { flex-wrap: nowrap; gap: 0; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }

<!-- Lobby overlay -->
<div id="lobby-overlay">

      <label>Your name</label>

window.sortHand = sortHand;
window.playCards = playCards;
window.passTurn = passTurn;
window.toggleSidebar = toggleSidebar;
window.nextRound = nextRound;

console.log('[INIT] Functions attached to window');

initClient();

console.log('[INIT] initClient called');
