name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Run unit tests
        run: npm test

  deploy:
    name: firebase deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for Workload Identity Federation
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Keyless auth: GitHub OIDC -> WIF -> service account.
      # create_credentials_file writes a WIF service-account credential file and
      # sets GOOGLE_APPLICATION_CREDENTIALS, which firebase-tools reads as ADC.
      # SA needs roles/firebasehosting.admin (granted on the project).
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: >-
            projects/153176493081/locations/global/workloadIdentityPools/pocerbanting/providers/github
          service_account: pocerbanting-ci@clear-region-377216.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      # NOTE: pinned to v14. firebase-tools v15 has a known bug (issue #10726)
      # where it SILENTLY ignores Application Default Credentials /
      # GOOGLE_APPLICATION_CREDENTIALS in CI and falls back to an interactive
      # login prompt. v14 correctly honours the WIF service-account credential
      # file that google-github-actions/auth produces.
      - name: Install firebase-tools (pinned v14)
        run: npm install -g firebase-tools@14

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project clear-region-377216 --non-interactive
