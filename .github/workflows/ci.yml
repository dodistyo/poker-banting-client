name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Run unit tests
        run: npm test

  deploy:
    name: firebase deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for Workload Identity Federation
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Keyless auth: GitHub OIDC -> WIF. NO `service_account`: the WIF
      # principal holds firebasehosting.admin directly, so firebase-tools
      # uses the WIF identity as-is (no SA-impersonation hop, which would
      # need iam.serviceAccountTokenCreator on the SA resource).
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: >-
            projects/153176493081/locations/global/workloadIdentityPools/pocerbanting/providers/github
          create_credentials_file: true
          export_environment_variables: true

      # Pinned to v14: firebase-tools v15 silently ignores
      # GOOGLE_APPLICATION_CREDENTIALS in CI (issue #10726). The `firebase`
      # binary below comes from the global v14 install — do NOT call
      # `npx firebase-tools`, which resolves the (unpinned) latest version.
      - name: Install firebase-tools (pinned v14)
        run: npm install -g firebase-tools@14

      - name: Deploy to Firebase Hosting
        run: |
          firebase --version
          firebase deploy --only hosting --project clear-region-377216 --non-interactive
